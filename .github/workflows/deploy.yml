name: Deploy Discord Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ci
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          # Note: Because authorized_keys on the server specifies a forced command
          # (restrict,command="sudo /usr/local/bin/deploy-velle-bot"), sshd ignores
          # any command passed in "script" and always runs the forced deploy script.
          script: sudo /usr/local/bin/deploy-velle-bot
